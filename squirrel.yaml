# Squirrel settings
# encoding: utf-8
# 修改自: https://github.com/rime/squirrel/blob/master/data/squirrel.yaml
#
# COMMIT SHA: 4fd723822a8882be73399f606ee3d63e5a5714c6

config_version: "2026-07-06"

# 可用选项：last | default | _custom_
# last：上次使用的拉丁字母键盘布局
# default：美国（ABC）键盘布局
# _custom_：键盘布局，例如 'com.apple.keylayout.USExtended' 或简写的 'USExtended'
keyboard_layout: last

# 给打字贼快的家伙们设置的按键持续时间（
chord_duration: 0.1 # seconds

# 通知设置
# options: always | never | appropriate
show_notifications_when: appropriate
show_notifications_via_notification_center: true

# 状态栏图标
# show: 是否显示状态栏图标，设置为 false 可隐藏状态栏图标
# 图标的文本为 schema 的 ascii_mode 的短状态标签（通过 get_state_label_abbreviated 获取）。
# 声明了 `abbrev: [中, Ａ]` 的 schema 会得到紧凑的字形；否则 schema 的 `states:` 值会按原样使用。
# 当没有定义 `states:` 时，回退为 "中" / "Ａ"。
status_icon:
  show: true

app_options: {} # 清除应用默认输入法，防止无法输入中文（建议通过 Caps 切换中英文）

style:
  color_scheme: qujiang_liu # 主题方案
  color_scheme_dark: qujiang_liu_dark # 指定深色模式时输入法所使用的主题方案
  translucency: true # 背景半透明总开关，不需要关掉即可

  # 是否将选定的候选项作为文本嵌入到输入框中
  inline_candidate: false
  # 是否将候选栏贴附到屏幕边缘来减少跳动
  memorize_size: true
  # 是否允许透明颜色之间的堆叠
  mutual_exclusive: true
  # 启用小箭头来看能否上下翻页
  show_paging: false

  # 以下为鼠须管默认设置
  candidate_list_layout: linear # stacked | linear
  text_orientation: horizontal # horizontal | vertical
  inline_preedit: true # 是否内嵌输入码
  corner_radius: 7
  hilited_corner_radius: 0
  border_height: -2
  border_width: -2
  line_spacing: 5
  spacing: 8
  # 大于 0 则会在高亮的候选项周围绘制阴影
  shadow_size: 0
  # 控制非高亮候选背景大小，相对于高亮
  surrounding_extra_expansion: 0
  # 候选项的格式
  candidate_format: "[label]. [candidate] [comment]"
  # base_offset: 0 # 竖排文字的基线调整
  # font_face: "Lucida Grande"
  font_point: 16
  # label_font_face: 'Lucida Grande'
  label_font_point: 12
  # comment_font_face: 'Lucida Grande'
  comment_font_point: 16

preset_color_schemes:
  # 关于主题中的各个设置项的说明，详见文件末尾
  qujiang_liu:
    name: "曲江柳／Qujiang Willow"
    author: "nfish <nfish@jajalink.com>"

    font_point: 14
    label_font_point: 12

    candidate_format: "[label] [candidate] [comment]"
    candidate_list_layout: linear
    text_orientation: horizontal
    inline_preedit: true

    corner_radius: 6
    hilited_corner_radius: 5
    shadow_size: 1
    line_spacing: 6
    border_height: 0
    border_width: 0
    spacing: 4
    margin_x: 0
    margin_y: 0

    color_space: display_p3
    back_color: 0xFFFFFFFF
    border_color: 0xFFE7E4E4
    candidate_text_color: 0xFF1B1818
    comment_text_color: 0xFF7A7171
    label_color: 0xFF7A7171
    hilited_candidate_back_color: 0xFF7FAE7F
    hilited_candidate_text_color: 0xFFFFFFFF
    hilited_comment_text_color: 0xFFF0F7F0
    hilited_candidate_label_color: 0xFFFFFFFF
    text_color: 0xFF1B1818
    hilited_text_color: 0xFF1B1818

  qujiang_liu_dark:
    name: "曲江柳／Qujiang Willow／深色"
    author: "nfish <nfish@jajalink.com>"

    font_point: 14
    label_font_point: 12

    candidate_format: "[label] [candidate] [comment]"
    candidate_list_layout: linear
    text_orientation: horizontal
    inline_preedit: true

    corner_radius: 6
    hilited_corner_radius: 5
    shadow_size: 1
    line_spacing: 6
    border_height: 0
    border_width: 0
    spacing: 4
    margin_x: 0
    margin_y: 0

    color_space: display_p3
    back_color: 0xFF1B1818
    border_color: 0xFF2A2727
    candidate_text_color: 0xFFFAFAFA
    comment_text_color: 0xFFAAA1A1
    label_color: 0xFFAAA1A1
    hilited_candidate_back_color: 0xFF7FAE7F
    hilited_candidate_text_color: 0xFFFFFFFF
    hilited_comment_text_color: 0xFFF0F7F0
    hilited_candidate_label_color: 0xFFFFFFFF
    text_color: 0xFFFAFAFA
    hilited_text_color: 0xFFFFFFFF

  # 若都有值，则对应的生效逻辑为
  ## .[custom].yaml > style/preset_color_schemes/[配置名] > style
  #
  # 各个设置项的简要作用说明
  # 以下出现的颜色均为 16 进制色值，(A)BGR顺序
  ## alpha: 透明度
  ## back_color: 候选条背景色
  ## base_offset: 候选框与输入框的垂直偏移量
  ## border_color: 边框颜色
  ## border_color_width: 输入条边框宽度
  ## border_height: 窗口上下高度
  ## border_width: 窗口左右宽度
  ## candidate_format: 候选格式
  ## candidate_list_layout: 候选列表布局
  ## candidate_spacing: 候选字间隔
  ## candidate_text_color: 候选项文字颜色
  ## color_space: 色彩空间
  ## comment_font_face: 拼音等提示文字字体
  ## comment_font_point: 拼音等提示文字字号
  ## comment_text_color: 拼音等提示文字颜色
  ## corner_radius: 候选条圆角
  ## font_face: 文本字体
  ## font_point: 文本字体大小
  ## hilite_padding: 候选字背景色色块高度
  ## hilited_back_color: 选中候选项背景背景色
  ## hilited_candidate_back_color: 选中候选项背景色
  ## hilited_candidate_label_color: 选中候选项编号颜色
  ## hilited_candidate_text_color: 选中候选项文字颜色
  ## hilited_comment_text_color: 注解文字高亮颜色
  ## hilited_corner_radius: 选中候选项圆角
  ## hilited_label_color: 选中候选项编号颜色
  ## hilited_text_color: 高亮文本颜色
  ## inline_preedit: 输入码是否内嵌显示
  ## label_color: 编号颜色
  ## label_font_face: 编号字体
  ## label_font_point: 编号大小
  ## label_format: 编号格式
  ## line_spacing: 行间距
  ## margin_x: 字左右边距
  ## margin_y: 字上下边距
  ## min_height: 最小高度
  ## min_width: 最小宽度
  ## round_corner: 候选字背景色块圆角幅度
  ## shadow_size: 阴影大小
  ## spacing: 间距
  ## text_color: 文本颜色
  ## text_orientation: 文本方向
